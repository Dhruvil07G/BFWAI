services:
  # FastAPI Backend Service
  - type: web
    name: bfwai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

  # Static Site Frontend (Vite React)
  - type: static
    name: bfwai-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bfwai-backend
          property: url
